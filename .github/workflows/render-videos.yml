# Makes Kurean's motion videos (TikTok, Reels) for new and edited stories. Free on a public repository.
# It asks kurean.news what is needed using GitHub's OIDC token (no stored secrets), renders with Remotion, uploads.
name: render-videos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: render-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Anything to make?
        id: check
        run: |
          TOKEN=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://kurean.news" | jq -r .value)
          N=$(curl -sS -H "Authorization: Bearer $TOKEN" https://kurean.news/api/video/jobs | jq '.jobs | length')
          echo "count=${N:-0}" >> "$GITHUB_OUTPUT"
          echo "Videos needed: ${N:-0}"
      - uses: actions/checkout@v4
        if: steps.check.outputs.count != '0'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.count != '0'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Install
        if: steps.check.outputs.count != '0'
        working-directory: video
        run: npm ci --no-audit --no-fund
      - name: Render and upload
        if: steps.check.outputs.count != '0'
        working-directory: video
        run: node render.mjs
